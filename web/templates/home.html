{{define "content"}}
<section class="hero">
  <h1>{{.T "home_h1"}}</h1>
</section>

{{if .Error}}<div class="alert error" role="alert">{{.Error}}</div>{{end}}

<form class="card create" method="post" action="/create">
  <div class="field">
    <label for="title">{{.T "f_title"}}</label>
    <input id="title" name="title" type="text" maxlength="120" required
           placeholder="{{.T "f_title_ph"}}" value="{{.Draft.Title}}">
  </div>
  <div class="field">
    <label for="description">{{.T "f_desc"}}</label>
    <textarea id="description" name="description" rows="2" maxlength="2000"
              placeholder="{{.T "f_desc_ph"}}">{{.Draft.Description}}</textarea>
  </div>

  <fieldset class="field kind" data-step="kind">
    <legend>{{.T "f_kind"}}</legend>
    <div class="segmented">
      <input type="radio" id="kind-date" name="kind" value="date"{{if eq .Draft.Kind "date"}} checked{{end}}>
      <label for="kind-date">{{.T "kind_date"}}</label>
      <input type="radio" id="kind-text" name="kind" value="text"{{if eq .Draft.Kind "text"}} checked{{end}}>
      <label for="kind-text">{{.T "kind_text"}}</label>
    </div>
  </fieldset>

  <div class="field only-date" data-step="dates">
    <label>{{.T "f_dates"}}</label>
    <p class="hint">{{.T "f_dates_hint"}}</p>
    {{template "datepicker" (dpData . .Draft.DatesInit)}}
  </div>
  <div class="only-date" data-step="duration">{{template "durationfield" .}}</div>
  <div class="field only-text" data-step="choices">
    <label for="choices">{{.T "f_choices"}}</label>
    <textarea id="choices" name="choices" rows="5" placeholder="{{.T "f_choices_ph"}}">{{.Draft.Choices}}</textarea>
  </div>

  <details class="more" data-step="finish">
    <summary>{{.T "more_settings"}}</summary>
    <label class="check">
      <input type="checkbox" name="allow_maybe" value="1"{{if .Draft.AllowMaybe}} checked{{end}}>
      <span>{{.T "f_maybe"}}</span>
    </label>
    <label class="check">
      <input type="checkbox" name="hide_results" value="1"{{if .Draft.HideResults}} checked{{end}}>
      <span>{{.T "hide_results"}}</span>
    </label>
    <div class="field">
      <label for="max_per_option">{{.T "max_label"}}</label>
      <input id="max_per_option" name="max_per_option" type="number" inputmode="numeric" min="1" max="9999" step="1" value="{{if .Draft.MaxPer}}{{.Draft.MaxPer}}{{end}}">
    </div>
    <div class="field">
      <label for="deadline">{{.T "deadline_label"}}</label>
      <input id="deadline" name="deadline" type="date" value="{{.Draft.Deadline}}">
    </div>
  </details>

  <div data-step="finish"><button class="btn primary" type="submit">{{.T "create"}}</button></div>
</form>

<section id="mypolls" class="card mypolls" hidden>
  <h2>{{.T "my_polls"}}</h2>
  <ul></ul>
</section>
{{end}}
