# Include this inside the existing `server { ... }` block that serves
# https://2-29-201-62.sslip.io, e.g.  include /opt/dudle/nginx-dudle.conf;
location = /dudle {
    return 301 /dudle/;
}
location /dudle/ {
    proxy_pass http://127.0.0.1:8080;      # path is forwarded unchanged (-base-path /dudle)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
    proxy_read_timeout 60s;
}
